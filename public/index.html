<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d12">
    <title>Echo Pairing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <header class="header">
            <a href="/" class="logo">echo<span>.</span></a>

            <button class="theme-btn" id="themeBtn">
                Light mode
            </button>
        </header>

        <section class="pair-card">

            <div class="card-top">
                <div class="icon">E</div>
                <span class="status">
                    <span class="dot"></span>
                    WhatsApp Pairing
                </span>
            </div>

            <h1>Link your WhatsApp</h1>

            <p class="description">
                Enter your WhatsApp number to generate a pairing code.
            </p>

            <form id="pairForm">

                <label for="number">Phone number</label>

                <input
                    type="tel"
                    id="number"
                    placeholder="+27686881509"
                    autocomplete="tel"
                    required
                >

                <small>
                    Include your country code without the + sign.
                </small>

                <button type="submit" id="generateBtn">
                    Generate code
                </button>

            </form>

            <div class="message" id="message"></div>

            <div class="result" id="result">

                <span class="result-label">Your pairing code</span>

                <div class="code-box">
                    <span id="pairCode">--------</span>
                    <button type="button" id="copyBtn">Copy</button>
                </div>

                <p>
                    Open WhatsApp → Linked Devices → Link with phone number.
                </p>

            </div>

        </section>

        <footer>
            <p>Echo </p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
